<div class="flex flex-col w-full h-full">
  <div class="flex flex-row h-[65%]">
    <div class="flex flex-col items-center justify-center w-[35%] h-full">
      <img
        *ngIf="selectedImage"
        [src]="selectedImage"
        alt="Foto de Perfil"
        width="350"
        height="150"
        class="block max-w-[350px] max-h-[350px] object-contain"
      />
      <input
        type="file"
        class="bg-[#468999] font-bold rounded-md"
        (change)="onFileSelected($event)"
        accept="image/*"
      />
    </div>
    <div class="flex item justify-center items-center w-[65%]">
      <div>
        <form [formGroup]="profileForm" class="grid grid-cols-2 gap-16 mt-4">
          <div class="w-full">
            <p class="font-bold text-gray-800">Nombres</p>
            <input
              type="text"
              formControlName="firstName"
              class="rounded-md bg-[#8DD0E1] px-3 py-2 text-white font-semibold"
            />
          </div>
          <div class="w-full">
            <p class="font-bold text-gray-800">Apellidos</p>
            <input
              type="text"
              formControlName="lastName"
              class="rounded-md bg-[#8DD0E1] px-3 py-2 text-white font-semibold"
            />
          </div>
          <div class="w-full">
            <p class="font-bold text-gray-800">Email</p>
            <input
              type="email"
              formControlName="email"
              class="rounded-md bg-[#8DD0E1] px-3 py-2 text-white font-semibold"
            />
          </div>
          <div class="w-full">
            <p class="font-bold text-gray-800">Fecha de Nacimiento</p>
            <div class="bg-[#8DD0E1] rounded-md px-3 py-2 flex items-center">
              <p-calendar
                formControlName="birthDate"
                dateFormat="dd-mm-yy"
                placeholder="Seleccione una fecha"
                inputStyleClass="bg-[#8DD0E1] focus:outline-none w-full text-white placeholder-white font-semibold"
                styleClass="w-full flex items-center"
              />
            </div>
          </div>
          <div class="w-full">
            <p class="font-bold text-gray-800">Celular</p>
            <input
              type="number"
              formControlName="phoneNumber"
              class="rounded-md bg-[#8DD0E1] px-3 py-2 text-white font-semibold"
            />
          </div>
          <div class="w-full">
            <p class="font-bold text-gray-800">Género</p>
            <div
              class="bg-[#8DD0E1] rounded-md flex items-center font-semibold"
            >
              <p-dropdown
                [options]="genres"
                optionLabel="name"
                optionValue="id"
                formControlName="genre"
                placeholder="Seleccione su género"
                inputStyleClass="bg-gray-300 focus:outline-none placeholder-white font-semibold"
                styleClass="w-full flex items-center"
              />
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="flex flex-row justify-center items-center">
    <button
      pButton
      label="Editar"
      class="bg-[#36A6EB] px-24 py-2 mr-4 rounded-xl text-white font-bold"
      (click)="editModal('editar')"
    ></button>
    <button
      pButton
      label="Eliminar"
      class="bg-red-700 px-24 py-2 rounded-xl text-white font-bold"
      (click)="editModal('eliminar')"
    ></button>
  </div>
</div>

<p-dialog
  [(visible)]="showEditForm"
  [modal]="true"
  header="Edita tu información"
>
  <div class="w-full h-full flex flex-col justify-center items-start">
    <div>
      <form [formGroup]="editForm" class="grid grid-cols-2 gap-4">
        <div class="w-full">
          <p class="font-bold text-gray-800">Nombres:</p>
          <input
            type="text"
            class="w-full rounded-md px-3 py-2 bg-[#8DD0E1] text-white placeholder-white focus:outline-none font-semibold"
            placeholder="Ingrese sus nombres"
            formControlName="firstName"
          />
        </div>
        <div class="w-full">
          <p class="font-bold text-gray-800">Apellidos:</p>
          <input
            type="text"
            class="w-full rounded-md px-3 py-2 bg-[#8DD0E1] text-white placeholder-white focus:outline-none font-semibold"
            placeholder="Ingrese sus apellidos"
            formControlName="lastName"
          />
        </div>
        <div class="w-full">
          <p class="font-bold text-gray-800">Email:</p>
          <input
            type="email"
            class="w-full rounded-md px-3 py-2 bg-[#8DD0E1] text-white placeholder-white focus:outline-none font-semibold"
            placeholder="Ingrese su email"
            formControlName="email"
          />
        </div>
        <div class="w-full">
          <p class="font-bold text-gray-800">Celular:</p>
          <input
            type="number"
            class="w-full rounded-md px-3 py-2 bg-[#8DD0E1] text-white placeholder-white focus:outline-none font-semibold"
            placeholder="Ingrese su fecha de Nacimiento"
            formControlName="phoneNumber"
          />
        </div>
        <div class="w-full">
          <p class="font-bold text-gray-800">Fecha de Nacimiento</p>
          <div class="bg-[#8DD0E1] rounded-md px-3 py-2 flex items-center">
            <p-calendar
              formControlName="birthDate"
              dateFormat="dd-mm-yy"
              placeholder="Seleccione una fecha"
              inputStyleClass="bg-[#8DD0E1] focus:outline-none w-full placeholder-white text-white font-semibold"
              styleClass="w-full flex items-center"
            />
          </div>
        </div>
        <div class="w-full">
          <p class="font-bold text-gray-800">Género</p>
          <div class="bg-[#8DD0E1] rounded-md flex items-center">
            <p-dropdown
              [options]="genres"
              optionLabel="name"
              optionValue="id"
              formControlName="genre"
              placeholder="Seleccione su género"
              inputStyleClass="bg-gray-300 focus:outline-none placeholder-white text-white font-semibold"
              styleClass="w-full flex items-center"
            />
          </div>
        </div>
        <div class="w-full">
          <p class="font-bold text-gray-800">Contraseña (Opcional)</p>
          <input
            type="text"
            formControlName="password"
            placeholder="Ingrese su celular"
            class="rounded-md bg-[#8DD0E1] text-white px-3 py-2 placeholder-white focus:outline-none font-semibold"
          />
        </div>
      </form>
    </div>
  </div>
  <div class="flex flex-row justify-center items-center mt-4">
    <button
      pButton
      label="Guardar"
      class="bg-[#36A6EB] px-12 py-2 mr-4 rounded-xl text-white font-bold"
      (click)="showConfirmationDialog = true"
    ></button>
    <button
      pButton
      label="Cancelar"
      class="bg-red-700 px-9 py-2 rounded-xl text-white font-bold"
      (click)="showEditForm = false"
    ></button>
  </div>
</p-dialog>

<app-confirmation-dialog
  [(visible)]="showConfirmationDialog"
  [title]="contentDialog.title"
  [description]="contentDialog.description"
  (confirm)="switchActionDialog()"
  (cancel)="showConfirmationDialog = false"
></app-confirmation-dialog>
