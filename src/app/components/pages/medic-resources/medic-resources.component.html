<div class="resources-page">
  <section class="resources-hero">
    <p class="resources-eyebrow">Biblioteca de apoyo</p>
    <h1>Lista de Recursos</h1>
    <p>
      Explora lecturas y contenidos seleccionados para complementar tu proceso
      de bienestar emocional.
    </p>
  </section>

  <section class="resources-grid">
  @for (card of cardContent; track $index) {
  <p-card
    class="resource-card"
  >
    <ng-template pTemplate="title">
      <p>{{ card.title }}</p>
    </ng-template>
    <ng-template pTemplate="content">
      <div class="resource-content">
        <img
          [src]="card.image"
          alt="Imagen link"
        />
        <div class="resource-body">
          <div>
            <p class="resource-label">Descripción</p>
            <p class="resource-description line-clamp-4">
              {{ card.description }}
            </p>
          </div>
          <div class="resource-actions">
            <a
              pButton
              label="Ver más"
              class="resource-link"
              [href]="card.link"
              target="_blank"
            ></a>
          </div>
        </div>
      </div>
    </ng-template>
  </p-card>
  }
  </section>

  @if (this.isLoading == true) {
  <div class="loading-state">
    <span class="loading-dot"></span>
    <p>Cargando recursos</p>
  </div>
  }
  <div #loadMoreRef class="load-more-sentinel"></div>
</div>
