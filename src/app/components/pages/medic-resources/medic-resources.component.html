<div class="flex flex-col items-center mt-2">
  <p class="justify-center font-bold text-[25px]">Lista de Recursos</p>
  @for (card of cardContent; track $index) {
  <p-card
    class="flex flex-col justify-center items-center mt-2 w-1/2 rounded-2xl border-none shadow-none"
  >
    <ng-template pTemplate="title">
      <p class="text-[22px] w-full font-bold text-center text-[#2d3e40] m-0">
        {{ card.title }}
      </p>
    </ng-template>
    <ng-template pTemplate="content">
      <div class="flex flex-row w-full h-full justify-center items-center">
        <img
          [src]="card.image"
          alt="Imagen link"
          width="180"
          height="180"
          class="mr-3 rounded-md object-cover"
          style="min-width: 180px; min-height: 180px"
        />
        <div
          class="flex flex-col items-start text-justify flex-1 h-full justify-between"
        >
          <div class="flex-1 overflow-hidden">
            <p class="font-bold m-0 mb-1">Descripción:</p>
            <p class="m-0 text-[15px] line-clamp-4">{{ card.description }}</p>
          </div>
          <div class="flex justify-center w-full mt-2">
            <a
              pButton
              label="Ver más"
              class="p-button-sm text-white font-semibold rounded-full px-4 py-2"
              style="background-color: #36a6eb; border: none"
              [href]="card.link"
              target="_blank"
            ></a>
          </div>
        </div>
      </div>
    </ng-template>
  </p-card>
  } @if (this.isLoading == true) {
  <p>Cargando data</p>
  }
  <div #loadMoreRef class="h-20 w-full"></div>
</div>
