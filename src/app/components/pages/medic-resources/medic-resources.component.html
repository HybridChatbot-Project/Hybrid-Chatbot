<div class="flex flex-col items-center mt-2">
    @for (card of cardContent; track $index) {
    <p-card
        class="flex flex-col justify-center items-center mt-2 w-1/2 rounded-2xl border-none shadow-none"
        >
        <ng-template pTemplate="title">
        <p class="text-[22px] w-full font-bold text-center text-[#2d3e40] m-0">
            {{ card.title }}
        </p>
        </ng-template>
        <ng-template pTemplate="content">
        <div class="flex flex-row w-full justify-center items-center">
            <img
            [src]="card.image"
            alt="Imagen link"
            width="120"
            height="120"
            class="mr-3 rounded-md"
            />
            <div class="flex flex-col items-start text-justify">
            <p class="font-bold m-0">Descripción:</p>
            <p class="m-0 mb-0 text-[15px]">{{ card.description }}</p>
            <div class="flex justify-center w-full mt-2">
            <a
                pButton
                label="Ver más"
                class="p-button-sm text-white font-semibold rounded-full px-4 py-2"
                style="background-color: #36A6EB; border: none;"
                [href]="card.link"
                target="_blank" 
            ></a>
        </div>
            </div>
        </div>
        </ng-template>
    </p-card>
    }
</div>
