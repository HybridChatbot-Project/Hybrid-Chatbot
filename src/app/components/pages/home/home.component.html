<div
  class="flex flex-col justify-center items-center w-full h-full overflow-hidden"
>
  <div class="flex flex-col items-center h-full w-full">
    <div
      class="flex flex-col justify-center items-center w-[50%] h-[40%] mt-4 border rounded-xl border-gray-950"
    >
      <img
        src="assets/images/logo.png"
        alt="Foto de perfil"
        class="w-1/4 max-w-[160px] h-auto mb-4 block object-contain"
      />
      <p class="font-extrabold text-[25px]">Bienvenido {{ name }}!!</p>
      <p class="font-semibold text-[25px]">¿Que deseas realizar?</p>
    </div>
    @for (homeRoute of homeRoutes; track $index) {
    <div
      class="flex flex-col justify-center items-center w-[50%] min-h-[100px] bg-[#BDD7CB] mt-2 p-2 border rounded-2xl border-gray-950 cursor-pointer hover:bg-[#a8c4b8] transition-colors"
      [routerLink]="[homeRoute.path]"
    >
      <div class="flex flex-row items-center gap-3 mb-1">
        <div [innerHTML]="homeRoute.icon" class="text-black"></div>
        <p class="font-bold text-[20px] m-0">{{ homeRoute.title }}</p>
      </div>

      <p class="text-[15px] text-gray-700 m-0 text-center">
        {{ homeRoute.subtitle }}
      </p>
    </div>
    }
  </div>
</div>
