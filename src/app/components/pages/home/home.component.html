<div
  class="flex flex-col justify-center items-center w-full h-full overflow-hidden"
>
  <div class="flex flex-col items-center h-full w-full">
    <div
      class="flex flex-col justify-center items-center w-[50%] h-[40%] mt-4 border rounded-xl border-gray-950"
    >
      <img
        src="assets/images/logo.png"
        alt="Foto de perfil"
        class="w-1/4 max-w-[160px] h-auto mb-4 block object-contain"
      />
      <p class="font-extrabold text-[25px]">Bienvenido {{ name }}!!</p>
      <p class="font-semibold text-[25px]">¿Que deseas realizar?</p>
    </div>
    @for (homeRoute of homeRoutes; track $index) {
    <div
      class="flex flex-row justify-start items-center w-[50%] h-[10%] bg-[#BDD7CB] mt-4 border rounded-2xl border-gray-950"
      [routerLink]="[homeRoute.path]"
    >
      <div [innerHTML]="homeRoute.icon" class="text-black p-2"></div>
      <div class="flex flex-col items-start">
        <p class="font-bold text-[20px]">{{ homeRoute.title }}</p>
        <p class="text-[15px]">{{ homeRoute.subtitle }}</p>
      </div>
    </div>
    }
  </div>
</div>
