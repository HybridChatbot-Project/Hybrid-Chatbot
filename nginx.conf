server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Angular client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 7d;
        access_log off;
    }
}
